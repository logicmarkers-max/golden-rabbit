<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-label="Sky Shots">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1d3a"/>
      <stop offset="50%" stop-color="#2c2f5a"/>
      <stop offset="100%" stop-color="#0f3460"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#ffd700" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffd700" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="400" height="400" fill="url(#bg)"/>
  <rect width="400" height="400" fill="url(#glow)"/>
  <circle cx="200" cy="180" r="90" fill="none" stroke="#ffd700" stroke-width="2" opacity="0.25"/>
  <text x="200" y="220" text-anchor="middle" font-size="108">&#127878;</text>
  <text x="200" y="320" text-anchor="middle" fill="#ffd700" font-family="system-ui,sans-serif" font-size="22" font-weight="600" letter-spacing="2">SKY SHOTS</text>
</svg>
